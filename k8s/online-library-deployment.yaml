
apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-library-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: online-library
  template:
    metadata:
      labels:
        app: online-library
    spec:
      containers:
        - name: online-library-container
          image: online-library-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
---
apiVersion: v1
kind: Service
metadata:
  name: online-library-service
spec:
  type: NodePort
  selector:
    app: online-library
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30082
